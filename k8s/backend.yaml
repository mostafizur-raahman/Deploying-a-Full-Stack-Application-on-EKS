apiVersion: apps/v1
kind: Deployment
metadata:
    name: backend
    namespace: todo-app
    labels:
        app: backend
spec:
    replicas: 2
    selector:
        matchLabels:
            app: backend
    template:
        metadata:
            labels:
                app: backend
        spec:
            containers:
                - name: backend
                  image: mostafizurrahman24/todo-backend-flask:latest
                  ports:
                      - containerPort: 5000
                  env:
                      - name: DATABASE_URL
                        value: "postgresql://postgres:postgres@postgres:5432/tododb"
                  resources:
                      requests:
                          memory: "128Mi"
                          cpu: "100m"
                      limits:
                          memory: "256Mi"
                          cpu: "250m"
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 5000
                      initialDelaySeconds: 30
                      periodSeconds: 30
                      timeoutSeconds: 10
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 5000
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
    name: backend
    namespace: todo-app
spec:
    selector:
        app: backend
    ports:
        - port: 5000
          targetPort: 5000
    type: ClusterIP
