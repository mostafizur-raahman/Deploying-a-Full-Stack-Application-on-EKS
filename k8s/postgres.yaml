apiVersion: v1
kind: Secret
metadata:
    name: postgres-secret
    namespace: todo-app
type: Opaque
data:
    POSTGRES_USER: cG9zdGdyZXM=
    POSTGRES_PASSWORD: cG9zdGdyZXM=
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: postgres
    namespace: todo-app
    labels:
        app: postgres
spec:
    replicas: 1
    selector:
        matchLabels:
            app: postgres
    template:
        metadata:
            labels:
                app: postgres
        spec:
            containers:
                - name: postgres
                  image: postgres:15-alpine
                  ports:
                      - containerPort: 5432
                  env:
                      - name: POSTGRES_USER
                        valueFrom:
                            secretKeyRef:
                                name: postgres-secret
                                key: POSTGRES_USER
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: postgres-secret
                                key: POSTGRES_PASSWORD
                      - name: POSTGRES_DB
                        value: "tododb"
                  volumeMounts:
                      - name: postgres-storage
                        mountPath: /var/lib/postgresql/data
                  resources:
                      requests:
                          memory: "128Mi"
                          cpu: "100m"
                      limits:
                          memory: "256Mi"
                          cpu: "250m"
                  readinessProbe:
                      exec:
                          command:
                              - pg_isready
                              - -U
                              - postgres
                              - -d
                              - tododb
                      initialDelaySeconds: 10
                      periodSeconds: 10
            volumes:
                - name: postgres-storage
                  emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
    name: postgres
    namespace: todo-app
spec:
    selector:
        app: postgres
    ports:
        - port: 5432
          targetPort: 5432
    type: ClusterIP
